<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise for Navya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #ffdde1, #ee9ca7, #ff4081);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
    }
    .container {
      background: rgba(0,0,0,0.6);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      max-width: 700px;
      width: 90%;
      animation: fadeIn 1.5s ease;
      position: relative;
      z-index: 2;
      text-align: center;
    }
    h1, h2, p {
      margin: 10px 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    }
    button {
      padding: 16px 32px;
      font-size: 20px;
      background: linear-gradient(90deg, #ff4081, #ff9800);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.4s ease;
      box-shadow: 0 6px 20px rgba(255,64,129,0.6);
      letter-spacing: 1px;
    }
    button:hover {
      background: linear-gradient(90deg, #e91e63, #f57c00);
      transform: scale(1.1);
      box-shadow: 0 8px 25px rgba(255,152,0,0.8);
    }
    video {
      margin-top: 20px;
      width: 700px;
	  height: 350px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    img.landscape {
      margin-top: 20px;
      width: 450px;          /* smaller than full screen */
     /*  max-width: 800px;    landscape size */
      height: 350px;        /* keep aspect ratio */
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    .hidden { display: none; }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }
    /* Falling emojis */
    .emoji {
      position: absolute;
      top: -50px;
      font-size: 2.5rem;
      animation: fallDown 4s linear infinite;
      z-index: 0;
      opacity: 0.9;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    @keyframes fallDown {
      0% {transform: translateY(0) rotate(0deg); opacity: 0;}
      10% {opacity: 1;}
      100% {transform: translateY(120vh) rotate(360deg); opacity: 0;}
    }
  </style>
</head>
<body>
  <!-- Falling emojis -->
  <div class="emoji" style="left:5%; animation-delay:0s;">❤️</div>
  <div class="emoji" style="left:15%; animation-delay:0.5s;">💖</div>
  <div class="emoji" style="left:25%; animation-delay:1s;">💕</div>
  <div class="emoji" style="left:35%; animation-delay:1.5s;">🌹</div>
  <div class="emoji" style="left:45%; animation-delay:2s;">💘</div>
  <div class="emoji" style="left:55%; animation-delay:2.5s;">💝</div>
  <div class="emoji" style="left:65%; animation-delay:3s;">🥰</div>
  <div class="emoji" style="left:75%; animation-delay:3.5s;">✨</div>
  <div class="emoji" style="left:85%; animation-delay:4s;">🎉</div>
  <div class="emoji" style="left:95%; animation-delay:4.5s;">🎂</div>

  <div class="container" id="step1">
    <h1>Hi Navya, you have a surprise! 🎁</h1>
    <button onclick="showStep2()">Click here</button>
  </div>

  <div class="container hidden" id="step2">
    <p>Watch your surprise video below:</p>
    <video id="birthdayVideo" controls>
      <source src="sis.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button id="nextBtn" class="hidden" onclick="showStep3()">Next</button>
  </div>

  <div class="container hidden" id="step3">
    <h2>🎂💫 Happy Birthday Navya! 🎉</h2>
<p>🎁 May your heart always be filled with happiness and your life with unforgettable moments. 💖

    <img src="sis.jpeg" alt="Birthday Cake" class="landscape">
	<p>From, Manohar 🤞</p>
  </div>

  <script>
    function showStep2() {
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }
    function showStep3() {
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step3").classList.remove("hidden");
    }
    const video = document.getElementById("birthdayVideo");
    const nextBtn = document.getElementById("nextBtn");
    video.addEventListener("ended", function() {
      nextBtn.classList.remove("hidden");
    });
  </script>
</body>
</html>
